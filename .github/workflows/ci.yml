name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ───────────────────────────────────────────
  backend-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:v1.11.3
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        working-directory: backend
        run: |
          pip install ruff
          ruff check app/ tests/

      - name: Run pytest
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_TEST }}
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          QDRANT_COLLECTION_NAME: hannes_test
          LLM_MODEL: gpt-4o-mini
          EMBEDDING_MODEL: text-embedding-3-small
          EMBEDDING_DIMENSIONS: 1536
          CHUNK_SIZE: 1000
          CHUNK_OVERLAP: 200
          RETRIEVER_K: 6
          BM25_WEIGHT: "0.4"
          VECTOR_WEIGHT: "0.6"
          MAX_UPLOAD_SIZE_MB: 50
          ALLOWED_EXTENSIONS: pdf
          LOG_LEVEL: WARNING
        run: pytest tests/ -v --tb=short --asyncio-mode=auto

  # ── Frontend Build & Type Check ─────────────────────────────
  frontend-check:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --frozen-lockfile

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Next.js build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── Docker Compose Smoke Test ───────────────────────────────
  docker-smoke:
    name: Docker Compose — Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          cp .env.example .env
          sed -i "s|sk-...your-openai-key-here...|${{ secrets.OPENAI_API_KEY_TEST }}|g" .env

      - name: Build and start services
        run: docker compose up --build -d

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8000/health && break
            echo "Waiting… ($i/30)"
            sleep 5
          done

      - name: Verify frontend responds
        run: curl -sf http://localhost:3000

      - name: Tear down
        if: always()
        run: docker compose down -v
