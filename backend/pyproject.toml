[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "N", "ANN", "S", "B", "A", "C4", "RET", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401", "S101"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN", "S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
log_cli = true
log_level = "WARNING"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
